<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- favicon removed (file not present) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>gamefrontend</title>
    <link rel="stylesheet" href="/src/Main/style.css">
</head>
<body>
<div id="player-ui">
    <div class="bar-label">HP</div>
    <div class="bar-container">
        <div id="hp-fill"></div>
    </div>

    <div class="bar-label">MP</div>
    <div class="bar-container">
        <div id="mana-fill"></div>
    </div>

    <div class="hud-item kill-count-container">
        <div class="bar-label" id="kill-count-ui">Kills: 0 / 20 (Map 1)</div>
    </div>
    <div class="hud-item timer-container">
        <div class="bar-label" id="time-ui">Time: 0s</div>
    </div>
    <div class="hud-item storm-container">
        <div class="bar-label" id="storm-ui" style="color:red; display:none;">Bão Quái: 20s</div>
    </div>
    <div class="hud-item socket-check">
        <div class="bar-label" id="socket-ui" style="color:yellow;">Trạng thái Server: Connecting...</div>
    </div>
</div>

<button id="btn-pause" class="pause-btn" type="button" aria-label="Pause" aria-pressed="false" title="Pause">
    <span class="pause-icon" aria-hidden="true"></span>
</button>

<div id="loading-screen" class="loading-screen" aria-hidden="true">
    <div class="loading-topbar">
        <div class="brand">CloudMoon</div>
    </div>

    <div class="loading-center">
        <div class="moon"></div>
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>
    </div>

    <div class="loading-footer">
        <div class="loading-track">
            <div id="loading-progress" class="loading-progress"></div>
            <div id="loading-label" class="loading-label">Game will start... 0%</div>
        </div>
    </div>
</div>

<!-- WORLD MAP UI -->
<div id="world-map-ui" class="overlay hidden" aria-hidden="true">
    <div class="world-map-card">
        <h2>Sơ đồ di chuyển (World Map)</h2>
        <div class="map-container">
            <!-- Vẽ các đường nối -->
            <svg class="map-edges">
                <!-- 3 - 5 -->
                <line x1="60" y1="60" x2="260" y2="60"></line>
                <!-- 3 - 1 -->
                <line x1="60" y1="60" x2="60" y2="160"></line>
                <!-- 3 - 2 -->
                <line x1="60" y1="60" x2="160" y2="160"></line>
                <!-- 1 - 2 -->
                <line x1="60" y1="160" x2="160" y2="160"></line>
                <!-- 2 - 4 -->
                <line x1="160" y1="160" x2="260" y2="160"></line>
                <!-- 5 - 4 -->
                <line x1="260" y1="60" x2="260" y2="160"></line>
            </svg>

            <!-- Vẽ các node -->
            <!-- Chú ý: .active là để hiển thị trạng thái đang đứng ở map nào -->
            <div class="map-node node-3">3</div>
            <div class="map-node node-5">5</div>
            <div class="map-node node-1 active">1</div>
            <div class="map-node node-2">2</div>
            <div class="map-node node-4">4</div>
        </div>
        <p class="map-guide">Bạn đang ở Map 1. Nhấn tab/M để đóng.</p>
    </div>
</div>

<div id="game-over" class="overlay hidden" aria-hidden="true">
    <div class="overlay-card">
        <h1>Game Over</h1>
        <p>Bạn đã hết máu.</p>
        <button id="btn-restart" type="button">Chơi lại</button>
    </div>
</div>

<div id="app"></div>
<script type="module" src="/src/Main/main.js"></script>
</body>
</html>
